name: Gerar diagramas PNG

on:
  push:
    branches: [main]
    paths:
      - 'scripts/gerar_diagramas.py'
      - 'diagramas/README.md'
      - '.github/workflows/gerar-diagramas.yml'

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar Pillow
        run: python -m pip install --upgrade pillow

      - name: Gerar PNGs
        run: python scripts/gerar_diagramas.py

      - name: Versionar PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagramas/arquitetura-conceitual.png diagramas/fluxo-conversacional.png
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos PNGs."
          else
            git commit -m "docs: adicionar diagramas PNG"
            git push
          fi
