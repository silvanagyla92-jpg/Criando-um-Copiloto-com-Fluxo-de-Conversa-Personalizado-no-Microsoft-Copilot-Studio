name: Gerar diagramas PNG

on:
  push:
    branches: [main]
    paths:
      - 'scripts/gerar_diagramas.py'
      - '.github/workflows/gerar-diagramas.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-diagramas-main
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Instalar Pillow
        run: python -m pip install --upgrade pillow

      # Os PNGs são derivados exclusivamente do script versionado.
      - name: Gerar PNGs
        run: python scripts/gerar_diagramas.py

      - name: Verificar diagramas gerados
        run: |
          test -s diagramas/arquitetura-conceitual.png
          test -s diagramas/fluxo-conversacional.png

      - name: Versionar PNGs atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagramas/arquitetura-conceitual.png diagramas/fluxo-conversacional.png
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos PNGs."
          else
            git commit -m "docs: atualizar diagramas PNG"
            git push
          fi
